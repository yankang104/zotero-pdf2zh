<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?> <?xml-stylesheet
href="chrome://zotero/skin/zotero.css" type="text/css"?>
<!DOCTYPE html>
<html
    id="zotero-prefpane-__addonRef__-llmApiEditor"
    lang="zh-CN"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:html="http://www.w3.org/1999/xhtml"
    windowtype="zotero-prefpane-__addonRef__-llmApiEditor"
    sizemode="normal"
    scrolling="true"
>
    <link rel="stylesheet" href="editor.css" />

    <head>
        <title>LLM API 配置编辑器</title>
        <meta charset="utf-8" />
    </head>

    <body>
        <div class="form-container">
            <h2 id="dialog-title">LLM API 配置</h2>
            <div class="form-group">
                <label id="label-service-name" for="service">服务商</label>
                <div class="editor-combobox">
                    <input id="service" type="text" autocomplete="off" />
                    <select
                        id="service-options"
                        aria-labelledby="label-service-name"
                    >
                        <option value="">▼</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label id="label-api-key" for="apiKey">Key</label>
                <input
                    id="apiKey"
                    type="password"
                    autocomplete="off"
                    placeholder="API Key / Token"
                />
            </div>
            <div class="form-group">
                <label id="label-base-url" for="apiUrl">URL</label>
                <div class="editor-combobox">
                    <input
                        id="apiUrl"
                        type="text"
                        autocomplete="off"
                        placeholder="https://api.example.com/v1"
                    />
                    <select id="url-options" aria-labelledby="label-base-url">
                        <option value="">▼</option>
                    </select>
                </div>
            </div>
            <div class="form-group" id="api-format-group">
                <label id="label-api-format" for="relay-format">接口类型</label>
                <select id="relay-format" aria-labelledby="label-api-format">
                    <option value="chat">Chat Completions</option>
                    <option value="responses">Responses</option>
                    <option value="messages">Messages</option>
                </select>
            </div>
            <div class="form-group">
                <label id="label-model" for="model">模型</label>
                <div class="model-row">
                    <div class="editor-combobox">
                        <input id="model" type="text" autocomplete="off" />
                        <select
                            id="model-options"
                            aria-labelledby="label-model"
                        >
                            <option value="">▼</option>
                        </select>
                    </div>
                    <div id="model-actions"></div>
                </div>
                <p
                    id="fetch-models-status"
                    class="model-fetch-status"
                    aria-live="polite"
                ></p>
            </div>
            <details class="request-section" id="request-headers-section">
                <summary id="label-relay-headers">请求头</summary>
                <p
                    id="native-request-settings-note"
                    class="model-fetch-status"
                ></p>
                <fieldset id="request-headers-fields">
                    <div id="request-headers-container"></div>
                </fieldset>
            </details>
            <details class="request-section" id="request-body-section">
                <summary id="label-relay-body">请求体</summary>
                <div id="request-body-container"></div>
                <div id="extra-fields-container"></div>
            </details>
            <textarea id="relay-headers" hidden="hidden"></textarea>
            <textarea id="relay-body" hidden="hidden"></textarea>
            <div class="button-container">
                <button type="button" class="btn-secondary" id="cancel-btn">
                    取消
                </button>
                <button type="button" class="btn-primary" id="save-btn">
                    保存并使用
                </button>
            </div>
            <p id="editor-save-status" role="alert" aria-live="polite"></p>
        </div>

        <script src="presets.js"></script>
        <script src="parameters.js"></script>
        <script src="requestHeaders.js"></script>
        <script src="requestBody.js"></script>
        <script src="models.js"></script>
        <script src="editor.js"></script>
    </body>
</html>
