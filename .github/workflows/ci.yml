name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    server-python:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install existing Server test dependencies
              run: |
                  python -m pip install -r server/requirements.txt pydantic
                  python -m pip install --no-deps pdf2zh-next==2.9.0
            - name: Test Server behavior
              env:
                  PYTHONPATH: server
              run: python -m unittest discover -s server/tests -p 'test_*.py'
            - name: Test macOS client protocol without desktop actions
              run: python -m unittest discover -s integrations/macos/tests -p 'test_*.py'
            - name: Compile Server and integration sources
              run: python -m compileall -q server/pdf2zh_server server/server.py server/manage_packages.py server/update_packages.py integrations/macos
            - name: Build canonical Server package
              run: python pack_server.py
            - name: Inspect installed Server package layout
              run: |
                  python - <<'PY'
                  import zipfile
                  with zipfile.ZipFile('server.zip') as archive:
                      names = set(archive.namelist())
                  assert {
                      'server/server.py',
                      'server/config/config.toml.example',
                      'server/update_packages.py',
                      'server/pdf2zh_server/engines/next_runtime/runner.py',
                      'server/pdf2zh_server/web/index.html',
                  } <= names
                  assert not any(name.startswith(('server/server/', 'server/tests/', 'server/translated/')) for name in names)
                  assert 'server/config/config.toml' not in names
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: server-package
                  path: server.zip

    plugin:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: plugin/package-lock.json
            - name: Install plugin dependencies
              run: npm ci
              working-directory: plugin
            - name: Test plugin behavior
              run: npm test
              working-directory: plugin
            - name: Check plugin formatting and lint
              run: npm run lint:check
              working-directory: plugin
            - name: Build canonical plugin package
              run: npm run build
              working-directory: plugin
            - name: Inspect XPI resources
              run: |
                  python - <<'PY'
                  import zipfile
                  from pathlib import Path
                  assert not Path('plugin/build/zotero-pdf-2-zh.xpi').exists()
                  with zipfile.ZipFile('zotero-pdf-2-zh.xpi') as archive:
                      names = set(archive.namelist())
                  assert {
                      'content/settings/preferences.xhtml',
                      'content/settings/api-editor/editor.xhtml',
                      'content/settings/api-editor/editor.js',
                      'content/settings/api-editor/models.js',
                      'locale/en-US/pdf2zh-addon.ftl',
                      'locale/zh-CN/pdf2zh-addon.ftl',
                  } <= names
                  PY
            - uses: actions/upload-artifact@v4
              with:
                  name: plugin-package
                  path: zotero-pdf-2-zh.xpi
