name: Release

on:
    push:
        tags:
            - 'v**'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Match the tag to plugin and Server versions
              run: |
                  python - <<'PY'
                  import json, os, re
                  from pathlib import Path
                  expected = os.environ['RELEASE_TAG'].removeprefix('v')
                  plugin = json.loads(Path('plugin/package.json').read_text())['version']
                  source = Path('server/server.py').read_text(encoding='utf-8')
                  server = re.search(r'^__version__\s*=\s*["\x27]([^"\x27]+)', source, re.MULTILINE).group(1)
                  assert plugin == server == expected, (plugin, server, expected)
                  PY
            - name: Test Server and integration
              env:
                  PYTHONPATH: server
              run: |
                  python -m pip install -r server/requirements.txt pydantic
                  python -m pip install --no-deps pdf2zh-next==2.9.0
                  python -m unittest discover -s server/tests -p 'test_*.py'
                  python -m unittest discover -s integrations/macos/tests -p 'test_*.py'
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: plugin/package-lock.json
            - name: Test and build the plugin
              working-directory: plugin
              run: |
                  npm ci
                  npm test
                  npm run lint:check
                  npm run build
            - name: Build Server package
              run: python pack_server.py
            - name: Publish packages and manifests for this version
              shell: bash
              run: |
                  if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    assets=(zotero-pdf-2-zh.xpi server.zip plugin/build/update-beta.json)
                    options=(--title "Release $RELEASE_TAG" --generate-notes)
                    if [[ "$RELEASE_TAG" == *-* ]]; then
                      options+=(--prerelease)
                    else
                      assets+=(plugin/build/update.json)
                    fi
                    gh release create "$RELEASE_TAG" --verify-tag "${options[@]}" "${assets[@]}"
                  fi
            - uses: actions/checkout@v4
              with:
                  ref: zotero-updates
                  path: zotero-updates
            - name: Update the Zotero feed
              shell: bash
              run: |
                  manifests="$RUNNER_TEMP/zotero-update-manifests"
                  gh release download "$RELEASE_TAG" --pattern 'update*.json' --dir "$manifests"
                  cp "$manifests"/update*.json zotero-updates/
                  cd zotero-updates
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- update*.json
                  if ! git diff --cached --quiet; then
                    git commit -m "Publish Zotero updates for $RELEASE_TAG"
                    git push origin HEAD:refs/heads/zotero-updates
                  fi
